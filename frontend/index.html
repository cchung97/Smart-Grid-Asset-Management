<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#024d87" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint so a dark-mode user never sees a white flash.
      // Saved choice first, then the OS preference. Keep in step with src/state/theme.ts.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0f1419'
      } catch (e) {}
    </script>
    <title>Smart Grid Asset Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
