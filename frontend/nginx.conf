# Every backend /api endpoint needs the API key (x-api-key). It is added here,
# to each proxied request, so it never reaches the browser or the JS bundle; a key
# sent by a client is replaced. ${API_KEY} is filled in from the container's
# environment at start (nginx image "templates" mechanism); if it is unset the
# header is empty and the backend refuses every /api call. The value is put in
# quotes, so an API_KEY containing " or $ would break this file (use `openssl rand -hex 32`).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API — no path stripping; backend routes already include
    # /api (see docs/ARCHITECTURE.md section 3).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header x-api-key "${API_KEY}";
    }

    # Swagger UI and its spec: open on the backend, so no key is added. Proxied so the
    # footer's "API docs" link works from the app's own origin. "Try it out" calls /api on
    # this origin, where the block above adds the key.
    location /swagger/ {
        proxy_pass http://backend:8080/swagger/;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://backend:8080/docs;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $host;
    }

    # SPA routing: direct navigation / hard refresh on any /assets/:id
    # route must resolve to index.html, not a 404 (see ACTION_PLAN.md Day 6).
    location / {
        try_files $uri /index.html;
    }
}
